        <a class="social-link" href="https://www.instagram.com/satobianca_/" target="_blank" rel="noopener noreferrer">

          <svg class="link-arrow" aria-hidden="true"><use href="#arrow"/></svg>

          <svg class="link-arrow" aria-hidden="true"><use href="#arrow"/></svg>
        </a>
        <a class="social-link" href="viber://chat?number=%2B639198887366">
          <span class="icon-tile"><svg><use href="#viber"/></svg></span>
          <span class="link-text"><strong>Viber</strong><span>Chat with me · opens the app</span></span>

      <section class="contact" aria-label="Contact details">
        <div class="phone-row">
          <a class="phone-number" href="tel:+639198887366"><svg aria-hidden="true"><use href="#phone"/></svg><span>+63 919 888 7366</span></a>
          <button class="copy-button" type="button" aria-label="Copy phone number" hidden><svg aria-hidden="true"><use href="#copy"/></svg></button>
        </div>
        <p class="copy-status" role="status" aria-live="polite"></p>
        <a class="save-contact" href="biance-sato.vcf" download="Biance-Brilleta-Sato.vcf"><svg aria-hidden="true"><use href="#save"/></svg>Save my contact</a>

      <footer><span class="footer-line"></span><p>GOOD CONNECTIONS BEGIN WITH A HELLO.</p><span class="footer-monogram" aria-hidden="true">BS</span></footer>
